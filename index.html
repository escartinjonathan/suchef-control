<style>
/* ====== COLORES OFICIALES (guía de identidad Su Chef) — fáciles de cambiar ====== */
:root{
  --naranja:#F58448;      /* Naranja principal */
  --verde:#748451;        /* Verde oliva */
  --carbon:#292728;       /* Carbón */
  --crema:#F7F1E7;        /* Crema */
  --blanco:#FFFFFF;       /* Blanco */
  --verde-txt:#566339;    /* verde oliva oscurecido solo para texto (contraste) */
  --linea:#E6DDCC;
  --rojo:#B3261E;
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Lato,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--crema);color:var(--carbon);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3,.mont{font-family:Montserrat,Lato,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.top{background:var(--carbon);color:var(--crema);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--naranja)}
.top img{height:34px;width:auto}
.brand{font-family:Montserrat;font-weight:700;line-height:1.1}
.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--naranja);text-transform:uppercase}
main{padding:16px 14px 96px;max-width:1100px;width:100%;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--blanco);border-top:1px solid var(--linea);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;font-weight:700;color:#6b6762;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bnav button span{font-size:20px;line-height:1}
.bnav button.on{color:var(--carbon)}
.bnav button.on span{filter:none}
.bnav button.on::after{content:"";display:block;width:26px;height:3px;border-radius:3px;background:var(--naranja);margin-top:1px}
@media(min-width:900px){
  .app{grid-template-columns:240px 1fr}
  .top{display:none}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;background:var(--carbon);color:var(--crema);padding:20px 14px;position:sticky;top:0;height:100vh;gap:4px}
  .side .brand{font-size:20px;padding:4px 10px 18px}
  .side img{max-width:150px;margin:0 10px 10px}
  .side button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--crema);padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:700}
  .side button:hover{background:#3b3839}
  .side button.on{background:var(--naranja);color:var(--carbon)}
  main{padding:26px 28px 40px}
}
.h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 14px}
.h h2{font-size:22px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde-txt);margin:22px 0 8px}
.datebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.datebar input{padding:9px 10px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco)}
.btn{border:1px solid var(--linea);background:var(--blanco);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;min-height:40px}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:var(--carbon)}
.btn.ver{background:var(--verde);border-color:var(--verde);color:var(--blanco)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;min-height:30px;font-size:13px}
.btn.del{color:var(--rojo)}
.btn:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px}
.card .l{font-size:12px;font-weight:700;color:#6b6762;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-family:Montserrat;font-weight:800;font-size:20px;margin-top:3px;word-break:break-word}
.card.big{background:var(--carbon);color:var(--crema);border-color:var(--carbon);grid-column:1/-1}
.card.big .l{color:var(--naranja)}
.card.big .v{font-size:30px}
@media(min-width:700px){.card.big{grid-column:span 2}}
.box{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:6px 14px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea);align-items:center}
.ln:last-child{border-bottom:0}
.ln.tot{font-weight:800;font-family:Montserrat}
.pos{color:var(--verde-txt)}.neg{color:var(--rojo)}.mut{color:#6b6762;font-size:13px}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.item .m{flex:1;min-width:0}
.item .m b{display:block;overflow:hidden;text-overflow:ellipsis}
.item .a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.amt{font-family:Montserrat;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--crema);border:1px solid var(--linea)}
.tag.off{background:#eee;color:#777}
.empty{padding:22px 6px;text-align:center;color:#6b6762}
.warn{background:#FFF1E6;border:1px solid var(--naranja);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:800px){.filters{grid-template-columns:repeat(6,1fr)}}
label.f{display:block;font-size:12px;font-weight:700;color:#6b6762;margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;padding:10px;border:1px solid var(--linea);border-radius:10px;background:var(--blanco);font-weight:400;font-size:16px;color:var(--carbon)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tw{overflow-x:auto;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--linea);text-align:left;white-space:nowrap}
th{background:var(--crema);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
#modal{display:none;position:fixed;inset:0;z-index:100}
#modal.open{display:block}
.mbk{position:absolute;inset:0;background:rgba(41,39,40,.55)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--crema);border-radius:18px;padding:16px 18px;border-top:5px solid var(--naranja)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh h3{margin:0;font-size:17px;color:var(--carbon);text-transform:none;letter-spacing:0}
.x{border:0;background:none;font-size:20px;cursor:pointer}
.mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.err{color:var(--rojo);font-weight:700;font-size:14px;min-height:18px;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:14px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px}
.ok{color:var(--verde-txt);font-weight:700}
.nube{margin-left:auto;font-size:12px;font-weight:700;color:var(--crema);cursor:pointer;white-space:nowrap}
.nube.side{margin:auto 10px 6px;color:var(--naranja);padding:8px 4px}
</style>

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div>
    <header class="top">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <div class="brand">Su Chef <small>a tu mesa · control</small></div>
      <span class="nube" id="nubeTop" data-act="ir" data-t="ajustes"></span>
    </header>
    <main id="view"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>

<script src="nube-config.js"></script>
<script>
'use strict';
//#PURE-START
/* ================= LÓGICA PURA (sin pantalla): cálculos y pruebas ================= */
const pad=n=>String(n).padStart(2,'0');
const addDays=(f,n)=>{const [y,m,d]=f.split('-').map(Number);const dt=new Date(y,m-1,d+n);return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`};
function rangoSemana(f){const [y,m,d]=f.split('-').map(Number);const dow=(new Date(y,m-1,d).getDay()+6)%7;const a=addDays(f,-dow);return [a,addDays(a,6)]}
function rangoMes(f){const [y,m]=f.split('-').map(Number);const u=new Date(y,m,0).getDate();return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(u)}`]}
/* Importes se guardan en CENTAVOS (enteros) para evitar errores de redondeo. */
function parseMonto(t,permitirCero){
  if(t==null)return null;
  t=String(t).replace(/[$\s]/g,'');
  if(/^\d+,\d{1,2}$/.test(t))t=t.replace(',','.');   // "12,5" -> 12.5
  t=t.replace(/,/g,'');                                 // "1,250.50" -> 1250.50
  if(!/^\d+(\.\d{1,2})?$/.test(t))return null;
  const c=Math.round(parseFloat(t)*100);
  if(!isFinite(c))return null;
  if(c===0&&!permitirCero)return null;
  return c;
}
function estadoBase(){
  return {
    v:1,
    metodos:[{id:'ef',nombre:'Efectivo',tipo:'efectivo',activo:true},{id:'tj',nombre:'Tarjeta',tipo:'tarjeta',activo:true},{id:'tr',nombre:'Transferencia',tipo:'transferencia',activo:true}],
    categorias:['Proveedores','Terceros','Nómina','Renta','Servicios','Insumos','Mantenimiento','Otros'].map((n,i)=>({id:'c'+i,nombre:n,activo:true})),
    proveedores:[],terceros:[],cajasAhorro:[],
    ventas:[],gastos:[],cajaMovs:[],tarjetaMovs:[],ahorroMovs:[],bolsaMovs:[],
    cajaDia:{},          // { 'YYYY-MM-DD': {saldoInicial, contado} }
    log:[],meta:{lastBackup:null}
  };
}
const tipoMetodo=(S,id)=>{const m=S.metodos.find(x=>x.id===id);return m?m.tipo:'otro'};
const sum=a=>a.reduce((s,x)=>s+x,0);
function saldoInicialDe(S,f){
  const c=S.cajaDia[f];
  if(c&&c.saldoInicial!=null)return {valor:c.saldoInicial,manual:true};
  // Si el día anterior tuvo cierre, se empieza con el fondo que se dejó; si no, con el último conteo.
  const prev=Object.keys(S.cajaDia).filter(k=>k<f&&(S.cajaDia[k].cierre||S.cajaDia[k].contado!=null)).sort().pop();
  if(!prev)return {valor:0,manual:false};
  const p=S.cajaDia[prev];
  return {valor:p.cierre?p.cierre.fondo:p.contado,manual:false};
}
function calcDia(S,f){
  const ventas=S.ventas.filter(x=>x.fecha===f);
  const gastos=S.gastos.filter(x=>x.fecha===f);
  const cm=S.cajaMovs.filter(x=>x.fecha===f);
  const porMetodo=S.metodos.map(m=>({id:m.id,nombre:m.nombre,activo:m.activo,tipo:m.tipo,total:sum(ventas.filter(v=>v.metodo===m.id).map(v=>v.importe))}));
  const vTipo=t=>sum(ventas.filter(v=>tipoMetodo(S,v.metodo)===t).map(v=>v.importe));
  const gTipo=t=>sum(gastos.filter(g=>tipoMetodo(S,g.metodo)===t).map(g=>g.importe));
  const ventaTotal=sum(ventas.map(v=>v.importe));
  const comisiones=sum(ventas.map(v=>v.comision||0));
  const ventaEf=vTipo('efectivo'),ventaTj=vTipo('tarjeta'),ventaTr=vTipo('transferencia');
  const pagosEfTot=gTipo('efectivo'),pagosTj=gTipo('tarjeta'),pagosTr=gTipo('transferencia');
  // Pagos en efectivo hechos con el "dinero retirado" NO descuentan la caja del día.
  const pagosEfRet=sum(gastos.filter(g=>g.origen==='retirado'&&tipoMetodo(S,g.metodo)==='efectivo').map(g=>g.importe));
  const pagosEf=pagosEfTot-pagosEfRet;
  const pagosProv=sum(gastos.filter(g=>g.destTipo==='proveedor').map(g=>g.importe));
  const pagosTer=sum(gastos.filter(g=>g.destTipo==='tercero').map(g=>g.importe));
  const gastoTotal=sum(gastos.map(g=>g.importe));
  const entradas=sum(cm.filter(x=>x.tipo==='entrada').map(x=>x.importe));
  const retiros=sum(cm.filter(x=>x.tipo==='retiro').map(x=>x.importe));
  const ini=saldoInicialDe(S,f);
  const esperado=ini.valor+ventaEf+entradas-pagosEf-retiros;
  const contado=(S.cajaDia[f]&&S.cajaDia[f].contado!=null)?S.cajaDia[f].contado:null;
  const cierre=(S.cajaDia[f]&&S.cajaDia[f].cierre)||null;
  return {ventaTotal,comisiones,ventaEf,ventaTj,ventaTr,porMetodo,pagosEf,pagosEfRet,pagosTj,pagosTr,pagosProv,pagosTer,gastoTotal,
          entradas,retiros,saldoInicial:ini.valor,saldoInicialManual:ini.manual,esperado,contado,
          diferencia:contado==null?null:contado-esperado,cierre,cierreDesactualizado:!!cierre&&cierre.esperado!==esperado};
}
/* Comisión de la terminal (solo métodos tipo tarjeta): % + cargo fijo (+ IVA 16% opcional). Importes en centavos. */
function comisionMetodo(m,importe){
  if(!m||m.tipo!=='tarjeta')return 0;
  const pct=m.comisionPct||0,fijo=m.comisionFijo||0;
  let c=Math.round(importe*pct/100)+fijo;
  if(m.comisionIva)c=Math.round(c*1.16);
  return Math.max(0,Math.min(c,importe));
}
function parsePct(t){
  if(t==null)return 0;
  t=String(t).replace(/[%\s]/g,'').replace(',','.');
  if(t==='')return 0;
  if(!/^\d+(\.\d{1,3})?$/.test(t))return null;
  const n=parseFloat(t);return n<=100?n:null;
}
/* Tarjeta y transferencia llegan a la MISMA cuenta bancaria. */
const esBanco=(S,id)=>{const t=tipoMetodo(S,id);return t==='tarjeta'||t==='transferencia';};
/* Saldo registrado de la cuenta bancaria (acumulado hasta 'hasta', inclusive). Solo lo que se captura. */
function saldoTarjeta(S,hasta){
  hasta=hasta||'9999-12-31';
  const v=sum(S.ventas.filter(x=>x.fecha<=hasta&&esBanco(S,x.metodo)).map(x=>x.importe-(x.comision||0)));   // neto de comisión
  const g=sum(S.gastos.filter(x=>x.fecha<=hasta&&esBanco(S,x.metodo)).map(x=>x.importe));
  const e=sum(S.tarjetaMovs.filter(x=>x.fecha<=hasta&&x.tipo==='entrada').map(x=>x.importe));
  const s=sum(S.tarjetaMovs.filter(x=>x.fecha<=hasta&&x.tipo==='salida').map(x=>x.importe));
  return v+e-g-s;
}
function saldoAhorro(S,cajaId,hasta){
  hasta=hasta||'9999-12-31';
  const m=S.ahorroMovs.filter(x=>x.cajaId===cajaId&&x.fecha<=hasta);
  return sum(m.filter(x=>x.tipo==='entrada').map(x=>x.importe))-sum(m.filter(x=>x.tipo==='retiro').map(x=>x.importe));
}
/* Dinero retirado ("bolsa"): lo que nos llevamos al cerrar, menos lo que se gasta con él, +/- ajustes manuales. */
function calcBolsa(S,hasta){
  hasta=hasta||'9999-12-31';
  const cierres=Object.keys(S.cajaDia).filter(k=>k<=hasta&&S.cajaDia[k].cierre).map(k=>S.cajaDia[k].cierre.retirado);
  const man=S.bolsaMovs.filter(x=>x.fecha<=hasta);
  const gs=S.gastos.filter(g=>g.fecha<=hasta&&g.origen==='retirado'&&tipoMetodo(S,g.metodo)==='efectivo');
  return sum(cierres)+sum(man.filter(x=>x.tipo==='entrada').map(x=>x.importe))-sum(man.filter(x=>x.tipo==='salida').map(x=>x.importe))-sum(gs.map(g=>g.importe));
}
/* ===== Sincronización en la nube: lógica pura (se prueba sin internet) =====
   Cada registro (venta, gasto, proveedor, etc.) es un documento. Gana la última edición (u = hora).
   meta.map guarda, por registro, lo último que se sincronizó: {h: contenido, u: hora, d: borrado}. */
function aplanar(st){
  const m=new Map();
  Object.keys(st).forEach(c=>{
    if(c==='v'||c==='meta'||c==='log')return;      // la bitácora se queda en cada dispositivo
    const v=st[c];
    if(Array.isArray(v))v.forEach(x=>{if(x&&x.id)m.set(c+'~'+x.id,{col:c,id:x.id,t:'a',json:JSON.stringify(x)});});
    else if(v&&typeof v==='object')Object.keys(v).forEach(id=>m.set(c+'~'+id,{col:c,id,t:'o',json:JSON.stringify(v[id])}));
  });
  return m;
}
function _poner(st,col,id,obj,t){
  if(st[col]===undefined)st[col]=(t==='a')?[]:{};
  const v=st[col];
  if(Array.isArray(v)){const i=v.findIndex(x=>x&&x.id===id);if(i>=0)v[i]=obj;else v.push(obj);}
  else v[id]=obj;
}
function _quitar(st,col,id){
  const v=st[col];
  if(Array.isArray(v))st[col]=v.filter(x=>!(x&&x.id===id));
  else if(v&&typeof v==='object')delete v[id];
}
/* Aplica cambios que llegaron de la nube. Devuelve true si cambió algo local. */
function fusionarRemoto(st,meta,docs){
  let cambio=false;const actual=aplanar(st);
  docs.forEach(dd=>{
    const k=dd.col+'~'+dd.id,e=meta.map[k],loc=actual.get(k);
    if(e&&dd.u<=e.u)return;                                        // es el eco de lo que yo mismo mandé
    if(e&&((loc&&e.h!==loc.json)||(!loc&&!e.d)))return;           // tengo un cambio local sin mandar: gana lo local
    if(dd.d){if(loc){_quitar(st,dd.col,dd.id);cambio=true;}meta.map[k]={h:null,u:dd.u,d:true};}
    else{if(!loc||loc.json!==dd.json){_poner(st,dd.col,dd.id,JSON.parse(dd.json),dd.t);cambio=true;}meta.map[k]={h:dd.json,u:dd.u};}
    if(dd.u>(meta.maxU||0))meta.maxU=dd.u;
  });
  return cambio;
}
/* Calcula lo que hay que mandar a la nube (altas, ediciones y borrados locales). */
function opsLocales(st,meta,u){
  const actual=aplanar(st),ops=[];
  actual.forEach((r,k)=>{const e=meta.map[k];if(!e||e.d||e.h!==r.json){ops.push({k,col:r.col,id:r.id,t:r.t,json:r.json,u,d:false});meta.map[k]={h:r.json,u};}});
  Object.keys(meta.map).forEach(k=>{const e=meta.map[k];if(!actual.has(k)&&!e.d){const i=k.indexOf('~');ops.push({k,col:k.slice(0,i),id:k.slice(i+1),t:'a',json:'',u,d:true});meta.map[k]={h:null,u,d:true};}});
  return ops;
}
function correrPruebas(){
  const R=[];const t=(d,a,b)=>R.push({ok:a===b,desc:d+` (obtenido ${a}, esperado ${b})`});
  const S=estadoBase();const f='2026-03-10';
  const mk=(o)=>Object.assign({id:Math.random().toString(36).slice(2),hora:'12:00'},o);
  S.ventas.push(mk({fecha:f,importe:50000,metodo:'ef'}),mk({fecha:f,importe:30000,metodo:'tj'}),mk({fecha:f,importe:20000,metodo:'tr'}));
  S.cajaDia[f]={saldoInicial:100000,contado:139000};
  S.cajaMovs.push(mk({fecha:f,tipo:'entrada',importe:10000}),mk({fecha:f,tipo:'retiro',importe:5000}));
  S.gastos.push(mk({fecha:f,importe:15000,metodo:'ef',destTipo:'proveedor',categoria:'c0'}),mk({fecha:f,importe:8000,metodo:'tj',destTipo:'tercero',categoria:'c1'}));
  let d=calcDia(S,f);
  t('Venta total del día',d.ventaTotal,100000);
  t('Venta en efectivo',d.ventaEf,50000);
  t('Venta con tarjeta no entra a caja',d.ventaTj,30000);

function modal(titulo,cuerpo,onSubmit,ok){
  const m=$('#modal');
  const pie=onSubmit?`<div class="err" id="merr"></div><div class="mbtn"><button type="button" class="btn ghost" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">${ok||'Guardar'}</button></div>`:'';
  m.innerHTML=`<div class="mbk" data-act="cerrar"></div><div class="mbox"><div class="mh"><h3>${esc(titulo)}</h3><button class="x" data-act="cerrar" aria-label="Cerrar">✕</button></div><form id="mf" novalidate>${cuerpo}${pie}</form></div>`;
  m.classList.add('open');
  const f=$('#mf');
  if(onSubmit)f.addEventListener('submit',e=>{e.preventDefault();const r=onSubmit(Object.fromEntries(new FormData(f)));const fin=x=>{if(x===true||x===undefined){cerrar();}else{$('#merr').textContent=x;}};if(r&&typeof r.then==='function'){$('#merr').textContent='Un momento…';r.then(fin);}else fin(r);});
  else f.addEventListener('submit',e=>e.preventDefault());
}

/* ================= GUARDAR / BORRAR ================= */
const COLL={venta:'ventas',gasto:'gastos',caja:'cajaMovs',tarjeta:'tarjetaMovs',ahorro:'ahorroMovs',bolsa:'bolsaMovs'};
const KIND_TXT={venta:'venta',gasto:'gasto',caja:'movimiento de caja',tarjeta:'movimiento de la cuenta bancaria',ahorro:'movimiento de ahorro',bolsa:'ajuste de dinero retirado'};
function guardarRec(kind,id,datos){
  const arr=S[COLL[kind]];let r;
  if(id){r=arr.find(x=>x.id===id);Object.assign(r,datos,{editado:new Date().toISOString()});bit('Editó',`${KIND_TXT[kind]} ${money(r.importe)} del ${fmtF(r.fecha)}`);}
  else{r=Object.assign({id:uid(),creado:new Date().toISOString()},datos);arr.push(r);bit('Creó',`${KIND_TXT[kind]} ${money(r.importe)} del ${fmtF(r.fecha)}`);}
  guardar();return r;
}
function borrarRec(kind,id){
  const arr=S[COLL[kind]];const r=arr.find(x=>x.id===id);if(!r)return;
  if(kind==='caja'&&r.ahorroId){alert('Este movimiento viene de una caja de ahorro. Edítalo o bórralo desde la sección Cajas de ahorro.');return;}
  if(!confirm(`¿Eliminar este ${KIND_TXT[kind]} de ${money(r.importe)} (${fmtF(r.fecha)})?\nEsta acción no se puede deshacer.`))return;
  if(kind==='ahorro'&&r.link)S.cajaMovs=S.cajaMovs.filter(x=>x.id!==r.link);
  S[COLL[kind]]=arr.filter(x=>x.id!==id);
  bit('Eliminó',`${KIND_TXT[kind]} ${money(r.importe)} del ${fmtF(r.fecha)}`);
  guardar();render();
}

function movimientos(){
  const o=[];
  S.ventas.forEach(x=>o.push({k:'venta',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Venta',s:1,imp:x.importe,cat:'',dest:'',met:x.metodo,nota:[x.nota,x.comision&&'Comisión '+money(x.comision)].filter(Boolean).join(' · ')}));
  S.gastos.forEach(x=>o.push({k:'gasto',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Gasto',s:-1,imp:x.importe,cat:x.categoria,dest:destNombre(x),destKey:x.destTipo?(x.destTipo[0]+':'+x.destId):'',met:x.metodo,nota:[x.descripcion,x.folio&&'Folio '+x.folio].filter(Boolean).join(' · ')}));
  S.cajaMovs.forEach(x=>o.push({k:'caja',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Caja · '+(x.tipo==='entrada'?'entrada':'retiro'),s:x.tipo==='entrada'?1:-1,imp:x.importe,cat:'',dest:'',met:'ef',nota:x.nota||''}));
  S.tarjetaMovs.forEach(x=>o.push({k:'tarjeta',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Cuenta bancaria · '+x.tipo,s:x.tipo==='entrada'?1:-1,imp:x.importe,cat:'',dest:'',met:'tj',nota:x.nota||''}));
  S.ahorroMovs.forEach(x=>o.push({k:'ahorro',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Ahorro · '+x.tipo,s:x.tipo==='entrada'?1:-1,imp:x.importe,cat:'',dest:nombre(S.cajasAhorro,x.cajaId),met:'',nota:x.nota||''}));
  S.bolsaMovs.forEach(x=>o.push({k:'bolsa',id:x.id,fecha:x.fecha,hora:x.hora,tipo:'Dinero retirado · '+x.tipo,s:x.tipo==='entrada'?1:-1,imp:x.importe,cat:'',dest:'',met:'',nota:x.nota||''}));
  return ordenar(o);
}

function rangoRep(){const {modo,fecha}=UI.rep;return modo==='dia'?[fecha,fecha]:modo==='semana'?rangoSemana(fecha):rangoMes(fecha);}
function datosRep(){
  const [a,b]=rangoRep();const dias=[];for(let f=a;f<=b;f=addDays(f,1))dias.push(f);
  const filas=dias.map(f=>({f,d:calcDia(S,f)}));
  const gs=S.gastos.filter(x=>x.fecha>=a&&x.fecha<=b);
  return {a,b,filas,
    ventas:sum(filas.map(x=>x.d.ventaTotal)),comis:sum(filas.map(x=>x.d.comisiones)),gastos:sum(filas.map(x=>x.d.gastoTotal)),
    prov:sum(filas.map(x=>x.d.pagosProv)),ter:sum(filas.map(x=>x.d.pagosTer)),
    porMetodo:S.metodos.map(m=>({n:m.nombre,t:sum(S.ventas.filter(v=>v.fecha>=a&&v.fecha<=b&&v.metodo===m.id).map(v=>v.importe))})).filter(x=>x.t>0),
    porCat:S.categorias.map(c=>({n:c.nombre,t:sum(gs.filter(g=>g.categoria===c.id).map(g=>g.importe))})).filter(x=>x.t>0)};
}

  Object.keys(S.cajaDia).forEach(k=>{const c=S.cajaDia[k].cierre;if(c)it.push({f:k,h:c.hora||'',s:1,imp:c.retirado,txt:'Retiro por cierre de caja',a:`<button class="btn sm" data-act="verCierre" data-f="${k}">Ver cierre</button>`});});

  S.gastos.filter(g=>g.origen==='retirado'&&tipoMetodo(S,g.metodo)==='efectivo').forEach(g=>it.push({f:g.fecha,h:g.hora,s:-1,imp:g.importe,txt:'Gasto · '+(nombre(S.categorias,g.categoria)||'')+(destNombre(g)?' · '+destNombre(g):''),a:`<button class="btn sm" data-act="edit" data-k="gasto" data-id="${g.id}">Editar</button>`}));
  it.sort((a,b)=>(b.f+b.h).localeCompare(a.f+a.h));
  const saldo=calcBolsa(S);
  return `<div class="h"><h2>Dinero retirado</h2><button class="btn" data-act="nuevoBolsa">+ Ajuste manual</button></div>
  <div class="grid">${card('Disponible (el que nos llevamos)',money(saldo),'big')}</div>
  ${saldo<0?'<div class="warn" style="margin-top:10px">⚠️ El saldo es negativo: registraste más gastos con dinero retirado que lo que se retiró en los cierres. Revisa los cierres o agrega un ajuste.</div>':''}
  <p class="mut">Es el efectivo que sacas de la caja al cerrar. Cuando compres algo con ese dinero, al registrar el gasto elige “Dinero retirado” y se descuenta de aquí, no de la caja.</p>
  <h3>Movimientos</h3><div class="box">${it.length?it.map(x=>`<div class="item"><div class="m"><b class="${x.s>0?'pos':'neg'}">${x.s>0?'+':'−'} ${money(x.imp)}</b><span class="mut">${fmtF(x.f)} ${x.h} · ${esc(x.txt)}</span></div><div class="a">${x.a}</div></div>`).join(''):'<div class="empty">Todavía no hay cierres de caja. Al cerrar la caja, lo que te llevas aparece aquí.</div>'}</div>`;
}
const VISTAS={bolsa:vBolsa,panel:vPanel,ventas:vVentas,gastos:vGastos,caja:vCaja,tarjeta:vTarjeta,ahorro:vAhorro,historial:vHistorial,reportes:vReportes,catalogos:vCatalogos,ajustes:vAjustes};
function render(){renderNav();$('#view').innerHTML=VISTAS[UI.tab]();}

/* ================= NUBE: sincronización en tiempo real (Firebase) ================= */
const FB='https://www.gstatic.com/firebasejs/10.14.1/';
const SYNC_KEY='suchef_sync_v1';
function nubeBadge(){
  return ({apagada:'',conectando:'☁️ Conectando…','sin-sesion':'☁️ Sin sesión',sincronizado:'☁️ Sincronizado',pendiente:'☁️ Sincronizando…','sin-red':'📴 Sin conexión',error:'⚠️ Error de nube'})[Nube.estado]||'';
}
function pintarNube(){
  const el=$('#nubeTop');if(el)el.textContent=nubeBadge();
  renderNav();
  if(UI.tab==='ajustes')$('#view').innerHTML=vAjustes();
}
function errNube(e){
  const c=(e&&e.code)||'';
  const M={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/email-already-in-use':'Ese correo ya tiene cuenta. Usa “Iniciar sesión”.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'El correo no es válido.','auth/missing-password':'Escribe tu contraseña.','auth/network-request-failed':'No hay internet. Inténtalo de nuevo con conexión.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/operation-not-allowed':'Falta habilitar “Correo y contraseña” en Firebase → Authentication.','permission-denied':'La nube rechazó el acceso. Revisa las reglas de seguridad de Firestore.','unauthenticated':'Inicia sesión para sincronizar.'};
  return M[c]||('Error: '+(c||(e&&e.message)||'desconocido'));
}
const Nube={
  estado:'apagada',user:null,msg:'',db:null,auth:null,fs:null,au:null,unsub:null,listo:false,timer:null,pend:0,
  meta:(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||null}catch(e){return null}})(),
  configurada(){const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&c.projectId&&!/PEGA/i.test(c.apiKey));},
  guardarMeta(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(this.meta));}catch(e){}},
  set(estado,msg){this.estado=estado;this.msg=msg||'';pintarNube();},
  async iniciar(){
    if(!this.configurada()){this.set('apagada');return;}
    if(this.auth)return;
    this.set('conectando');
    try{
      const [app,au,fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
      this.au=au;this.fs=fs;
      const a=app.initializeApp(window.FIREBASE_CONFIG);
      this.auth=au.getAuth(a);
      try{this.db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}
      catch(e){this.db=fs.getFirestore(a);}
      au.onAuthStateChanged(this.auth,u=>this.sesion(u));
    }catch(e){
      this.set('error','No se pudo cargar la conexión con la nube (¿sin internet?). Se reintentará al reconectar.');
    }
  },
  sesion(u){
    this.user=u;
    if(!u){this.parar();this.set('sin-sesion');return;}
    if(!this.meta||this.meta.uid!==u.uid){this.meta={uid:u.uid,map:{},maxU:0};}
    this.guardarMeta();this.escuchar();
  },
  parar(){if(this.unsub){this.unsub();this.unsub=null;}this.listo=false;},
  escuchar(){
    if(!this.user||!this.db)return;
    this.parar();this.set('conectando');
    const fs=this.fs,since=Math.max(0,(this.meta.maxU||0)-600000);   // margen de 10 min por diferencias de reloj
    const q=fs.query(fs.collection(this.db,'negocios',this.user.uid,'items'),fs.where('u','>',since));
    this.unsub=fs.onSnapshot(q,{includeMetadataChanges:true},snap=>{
      const docs=snap.docChanges().map(c=>c.doc.data());
      if(docs.length){
        const cambio=fusionarRemoto(S,this.meta,docs);this.guardarMeta();
        if(cambio){guardarLocal();render();}
      }
      if(!this.listo){this.listo=true;this.empujar();}
      this.set(!navigator.onLine?'sin-red':(this.pend>0||snap.metadata.hasPendingWrites)?'pendiente':'sincronizado');
    },err=>this.set('error',errNube(err)));
  },
  cambio(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.empujar(),500);},
  empujar(){
    if(!this.listo||!this.user||!this.db)return;
    const ops=opsLocales(S,this.meta,Date.now());
    if(!ops.length)return;
    this.guardarMeta();
    const fs=this.fs,uid=this.user.uid;
    for(let i=0;i<ops.length;i+=400){
      const b=fs.writeBatch(this.db);
      ops.slice(i,i+400).forEach(o=>b.set(fs.doc(this.db,'negocios',uid,'items',o.k),{col:o.col,id:o.id,t:o.t,json:o.json,u:o.u,d:o.d}));
      this.pend++;this.set('pendiente');
      b.commit().then(()=>{this.pend--;if(this.pend===0)this.set(navigator.onLine?'sincronizado':'sin-red');}).catch(e=>{this.pend--;this.set('error',errNube(e));});
    }
  },
  async entrar(email,pass,crear){
    if(!this.au||!this.auth)return 'La conexión con la nube aún no está lista. Revisa tu internet e inténtalo de nuevo.';
    try{
      if(crear)await this.au.createUserWithEmailAndPassword(this.auth,email,pass);
      else await this.au.signInWithEmailAndPassword(this.auth,email,pass);
      return true;
    }catch(e){return errNube(e);}
  },
  async salir(){if(this.au&&this.auth)await this.au.signOut(this.auth);},
  async recuperar(email){try{await this.au.sendPasswordResetEmail(this.auth,email);return true;}catch(e){return errNube(e);}}
};
window.addEventListener('online',()=>{if(Nube.configurada()){if(!Nube.auth)Nube.iniciar();else if(Nube.user)Nube.set(Nube.pend>0?'pendiente':'sincronizado');}});
window.addEventListener('offline',()=>{if(Nube.user)Nube.set('sin-red');});
function formNube(crear){
  modal(crear?'Crear cuenta de la nube':'Iniciar sesión en la nube',
    (crear?'<p class="mut">Crea la cuenta <b>una sola vez</b> (en tu laptop). En el celular solo inicia sesión con el mismo correo y contraseña.</p>':'')+
    inp('Correo','email','email','','autocomplete="email" autocapitalize="off"')+
    inp('Contraseña (mínimo 6 caracteres)','pass','password','','autocomplete="'+(crear?'new-password':'current-password')+'"'),
    d=>{const em=(d.email||'').trim();if(!em||!d.pass)return 'Escribe tu correo y tu contraseña.';return Nube.entrar(em,d.pass,crear);},
    crear?'Crear cuenta':'Iniciar sesión');
}
function bloqueNube(){
  const e=Nube.estado;let cuerpo='';
  if(e==='apagada')cuerpo=`<div class="item"><div class="m"><b>Nube sin configurar</b><span class="mut">La app funciona normal, solo en este dispositivo. Para compartir datos entre celular y laptop falta pegar los datos de Firebase en el archivo <b>nube-config.js</b> (sigue la guía GUIA-NUBE.txt).</span></div></div>`;
  else if(e==='error')cuerpo=`<div class="item"><div class="m"><b class="neg">Problema con la nube</b><span class="mut">${esc(Nube.msg)}</span></div><div class="a"><button class="btn" data-act="recargar">Reintentar</button>${Nube.user?'<button class="btn" data-act="nubeSync">Sincronizar</button>':''}</div></div>`;
  else if(!Nube.user)cuerpo=`<div class="item"><div class="m"><b>${e==='conectando'?'Conectando…':'Inicia sesión para sincronizar'}</b><span class="mut">Usa el mismo correo y contraseña en tu celular y en tu laptop.</span></div><div class="a"><button class="btn pri" data-act="nubeEntrar">Iniciar sesión</button><button class="btn" data-act="nubeCrear">Crear cuenta (primera vez)</button></div></div>`;
  else cuerpo=`<div class="item"><div class="m"><b>Conectado: ${esc(Nube.user.email||'')}</b><span class="mut">Estado: ${({conectando:'conectando…',sincronizado:'todo sincronizado ✔',pendiente:'enviando cambios…','sin-red':'sin conexión (los cambios se envían al reconectar)'})[e]||e}. Los cambios se ven en tus otros dispositivos en segundos.</span></div><div class="a"><button class="btn" data-act="nubeSync">Sincronizar ahora</button></div></div>
  <div class="item"><div class="m"><b>Volver a descargar todo</b><span class="mut">Úsalo si algo no se ve igual en este dispositivo.</span></div><div class="a"><button class="btn" data-act="nubeTodo">Descargar todo</button></div></div>
  <div class="item"><div class="m"><b>Cerrar sesión</b><span class="mut">Tus datos se quedan en este dispositivo, pero dejan de sincronizarse.</span></div><div class="a"><button class="btn del" data-act="nubeSalir">Cerrar sesión</button></div></div>`;
  return `<h3>Sincronización en la nube</h3><div class="box">${cuerpo}</div>`;
}
/* ================= EXPORTAR / RESPALDAR ================= */
function descargar(nombreArch,contenido,tipo){
  const b=new Blob([contenido],{type:tipo});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=nombreArch;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function csv(filas){return '\ufeff'+filas.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');}
function filasMov(l){return [['Fecha','Hora','Tipo','Categoría','Destinatario','Método','Nota','Importe (MXN, + entra / − sale)']].concat(l.map(m=>[fmtF(m.fecha),m.hora,m.tipo,nombre(S.categorias,m.cat),m.dest,nombre(S.metodos,m.met),m.nota,(m.s<0?'-':'')+decimal(m.imp)]));}
const ACT={
  ir:e=>ir(e.t),mas:()=>modal('Más secciones',`<div class="menu">${TABS.filter(t=>!BOTTOM.includes(t[0])).map(t=>`<button class="btn" data-act="ir" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join('')}</div>`),
  cerrar,cierre:formCierre,reabrir:reabrirCierre,copiarCierre:()=>copiarCierre(UI.fecha),nuevoBolsa:()=>formBolsaMov(),
  verCierre:e=>{UI.fecha=e.f;UI.tab='caja';render();window.scrollTo(0,0);},
  csvCierres:()=>{const rows=[['Fecha','Esperado','Contado','Diferencia','Se quedó en caja','Se llevó','Nota']].concat(Object.keys(S.cajaDia).filter(k=>S.cajaDia[k].cierre).sort().map(k=>{const c=S.cajaDia[k].cierre;return [fmtF(k),decimal(c.esperado),decimal(c.contado),(c.diferencia<0?'-':'')+decimal(Math.abs(c.diferencia)),decimal(c.fondo),decimal(c.retirado),c.nota||'']}));descargar('cierres-suchef-'+hoy()+'.csv',csv(rows),'text/csv;charset=utf-8');},
  dia:e=>{UI.fecha=addDays(UI.fecha,+e.n);render();},hoy:()=>{UI.fecha=hoy();render();},
  nuevo:e=>({venta:formVenta,gasto:formGasto,caja:formCajaMov,tarjeta:formTarjetaMov})[e.k](),
  edit:e=>({venta:formVenta,gasto:formGasto,caja:formCajaMov,tarjeta:formTarjetaMov,ahorro:formAhorroMov,bolsa:formBolsaMov})[e.k](e.id),
  del:e=>borrarRec(e.k,e.id),saldoini:formSaldoInicial,conteo:formConteo,ajusteTj:formAjusteTarjeta,
  nuevoAhorro:e=>formAhorroMov(null,e.c),selAhorro:e=>{UI.ahorroSel=e.c;render();},
  nuevoCat:e=>formCat(e.t),editCat:e=>formCat(e.t,e.id),togCat:e=>toggleCat(e.t,e.id),
  limpiaHist:()=>{UI.hist={desde:'',hasta:'',tipo:'',cat:'',dest:'',metodo:''};render();},togBit:()=>{UI.bitacora=!UI.bitacora;render();},
  csvHist:()=>descargar('historial-suchef-'+hoy()+'.csv',csv(filasMov(histFiltrado())),'text/csv;charset=utf-8'),
  csvTodo:()=>descargar('movimientos-suchef-'+hoy()+'.csv',csv(filasMov(movimientos())),'text/csv;charset=utf-8'),
  csvRep:()=>{const R=datosRep();const rows=[['Día','Ventas','Efectivo','Tarjeta','Transferencia','Gastos y pagos','Pagos proveedores','Pagos terceros','Comisiones terminal']].concat(R.filas.map(x=>[fmtF(x.f),decimal(x.d.ventaTotal),decimal(x.d.ventaEf),decimal(x.d.ventaTj),decimal(x.d.ventaTr),decimal(x.d.gastoTotal),decimal(x.d.pagosProv),decimal(x.d.pagosTer),decimal(x.d.comisiones)]),[['TOTAL',decimal(R.ventas),'','','',decimal(R.gastos),decimal(R.prov),decimal(R.ter),decimal(R.comis)]]);descargar(`reporte-suchef-${R.a}_${R.b}.csv`,csv(rows),'text/csv;charset=utf-8');},
  respaldo:()=>{S.meta.lastBackup=new Date().toISOString();guardar();descargar('respaldo-suchef-'+hoy()+'.json',JSON.stringify(S,null,1),'application/json');render();},
  pruebas:()=>{const R=correrPruebas();const mal=R.filter(x=>!x.ok).length;modal(mal?`❌ ${mal} prueba(s) fallaron`:`✔ ${R.length} pruebas correctas`,R.map(x=>`<div class="ln"><span>${x.ok?'✔':'❌'} ${esc(x.desc)}</span></div>`).join(''));},
  nubeEntrar:()=>formNube(false),nubeCrear:()=>formNube(true),recargar:()=>location.reload(),
  nubeSync:()=>{Nube.escuchar();},
  nubeTodo:()=>{if(!confirm('Se volverán a descargar todos los datos de la nube. ¿Continuar?'))return;Nube.meta.maxU=0;Nube.guardarMeta();Nube.escuchar();},
  nubeSalir:async()=>{if(!confirm('¿Cerrar sesión? Dejarás de sincronizar hasta volver a iniciar sesión.'))return;await Nube.salir();},
  reset:()=>{if(!confirm('¿Borrar TODOS los datos de este dispositivo?'+(Nube.user?'\n\n⚠️ Tienes la nube conectada: también se borrarán de la nube y de tus otros dispositivos.':'')))return;if(!confirm('Última confirmación: no se podrá deshacer. ¿Borrar todo?'))return;S=estadoBase();guardar();render();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset);});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-change]');if(!t)return;const k=t.dataset.change,v=t.value;
  if(k==='fecha'){if(v)UI.fecha=v;}
  else if(k.startsWith('h_'))UI.hist[k.slice(2)]=v;
  else if(k==='r_modo')UI.rep.modo=v;
  else if(k==='r_fecha'){if(v)UI.rep.fecha=v;}
  else if(k==='restaurar'){const file=t.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.ventas)||!Array.isArray(o.gastos)||!o.metodos)throw 0;if(!confirm('Esto reemplazará todos los datos actuales por los del respaldo. ¿Continuar?'+(Nube.user?'\n\n⚠️ Tienes la nube conectada: lo que no esté en el respaldo también se quitará de tus otros dispositivos.':'')))return;S=Object.assign(estadoBase(),o);guardar();render();alert('Respaldo restaurado.');}catch(x){alert('El archivo no parece un respaldo válido de esta aplicación.');}};rd.readAsText(file);return;}
  render();
});
render();
Nube.iniciar();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
